version: 1
name: codex-game-studio-default
summary: 2D-first, Godot-first Codex Game Studio workflow with simple premium visual design, master-level art roles, professional design artifacts, professional art production, modular implementation, CSV data config, Sprite Forge art, procedural motion, QA, and Git version finish.

agents:
  - id: producer
    tier: direction
    owns: [scope, milestones, risks, task_owners, acceptance_criteria, git_version_finish]
    skills: [sprint_planning, milestone_review, scope_control, delivery_reporting]
  - id: creative-director
    tier: direction
    owns: [game_identity, pillars, target_fantasy, references, anti_copying_constraints]
    skills: [concept_review, pillar_alignment, reference_interpretation, creative_gate]
  - id: technical-director
    tier: direction
    owns: [architecture, module_boundaries, engine_decisions, dependencies, performance_budget, technical_risk]
    skills: [architecture_review, module_boundary_review, dependency_risk, performance_budgeting, technical_gate]
  - id: game-designer
    tier: lead
    owns: [core_loop, mechanics, weapons, enemies, upgrades, progression, difficulty, gameplay_flowcharts, player_feedback_synthesis]
    skills: [system_design, gameplay_rules, player_motivation, player_feedback_discovery, feedback_synthesis, acceptance_criteria, professional_flowchart_spec]
  - id: systems-designer
    tier: lead
    owns: [economy, formulas, progression_curves, wave_pressure, upgrade_value]
    skills: [balance_math, tuning_models, economy_loops, data_table_design]
  - id: data-config-specialist
    tier: specialist
    owns: [csv_schemas, ids, references, starter_rows, validation_rules, loading_path]
    skills: [csv_schema_design, reference_validation, type_validation, godot_data_handoff]
  - id: prototyper
    tier: specialist
    owns: [risky_assumptions, throwaway_tests, demo_placeholders, proceed_pivot_cut_verdicts]
    skills: [minimum_tests, fast_iteration, emoji_demo_placeholders, svg_placeholder_assets, prototype_scope, learning_reports]
  - id: lead-programmer
    tier: lead
    owns: [implementation_plan, module_breakdown, module_contracts, integration, code_review, done_criteria]
    skills: [architecture_to_tasks, modular_task_breakdown, code_review, integration_planning, regression_risk]
  - id: godot-specialist
    tier: specialist
    owns: [scenes, nodes, resources, signals, autoloads, exports]
    skills: [godot_4_patterns, scene_integration, resource_design, export_checks]
  - id: gdscript-specialist
    tier: specialist
    owns: [typed_gdscript, signals, resources, component_patterns, hot_paths]
    skills: [typed_gdscript, idiomatic_signals, performance_in_hot_paths, script_organization]
  - id: gameplay-programmer
    tier: specialist
    owns: [movement, combat, spawning, weapons, pickups, run_state, procedural_feedback]
    skills: [gameplay_loops, object_pooling, combat_feedback, dense_arena_logic]
  - id: ui-programmer
    tier: specialist
    owns: [reusable_controls, theme_resources, screen_shells, touch_ergonomics, ui_motion, uiue_diagram_review, design_tokens, component_state_matrix, screenshot_parity]
    skills: [brawler_arcade_ui_core, ui_ux_pro_max_adaptation, design_system_tokens, godot_control_nodes, responsive_layouts, safe_area_layouts, accessibility_contrast, tweened_ui_feedback, uiue_implementability_review, figma_to_engine_handoff, screenshot_parity_review]
  - id: performance-analyst
    tier: specialist
    owns: [frame_time, collision_cost, memory, stress_checks]
    skills: [profiling_plans, pooling_analysis, dense_combat_budgets, bottleneck_reports]
  - id: art-director
    tier: lead
    owns: [visual_identity, art_bible, quality_bar, readability, ui_tone, asset_specs, generated_art_direction, final_art_signoff]
    skills: [art_direction, art_bible, simple_premium_2d_direction, visual_identity, style_cohesion, originality_gate, famous_company_reference_decomposition, complexity_budgeting, readability_review, production_quality_bar]
  - id: visual-development-artist
    tier: specialist
    owns: [mood, atmosphere, color_script, lighting_direction, key_art, composition, style_exploration]
    skills: [simple_premium_mood_boards, color_scripting, lighting_notes, composition_design, value_grouping, atmosphere_design, emotional_color_progression, focal_hierarchy, key_art_direction]
  - id: concept-artist
    tier: specialist
    owns: [characters, enemies, props, weapons, silhouettes, turnarounds, expression_pose_sheets]
    skills: [simple_shape_language, silhouette_design, character_readability, enemy_readability, prop_language, costume_material_callouts, concept_sheets, small_size_checks, production_callouts]
  - id: environment-artist
    tier: specialist
    owns: [scenes, maps, arenas, rooms, props_blockers, set_dressing, perspective, depth, environment_storytelling]
    skills: [simple_scene_composition, environment_storytelling, map_readability, prop_density_control, prop_layering, tilemap_composition, parallax_design, navigation_cues, blocker_readability, atmosphere_handoff]
  - id: ui-artist
    tier: specialist
    owns: [ui_visual_language, iconography, panels, buttons, typography_direction, visual_states, hud_menu_presentation]
    skills: [simple_premium_ui_style_frames, icon_sets, state_sheets, ui_identity, reusable_component_families, card_panel_systems, motion_language, visual_hierarchy, contrast_readability, localization_tolerance]
  - id: 2d-animation-specialist
    tier: specialist
    owns: [sprite_animation_states, frame_timing, frame_budgets, hit_reactions, action_readability, procedural_motion_blend]
    skills: [sprite_animation, essential_state_budgeting, frame_timing, animation_states, squash_stretch, anticipation_recovery, hit_reaction, vfx_timing, pose_readability, frame_economy, contact_frames, cancel_windows, procedural_motion_blend]
  - id: 2d-technical-artist
    tier: specialist
    owns: [sprite_import, sprite_atlases, tilemaps, y_sort, collision_2d, shader_material_rules, particle_vfx, godot_2d_handoff]
    skills: [sprite_import, sprite_atlas, tilemap_pipeline, y_sort, collision_2d, shader_materials, particle_vfx, pivot_discipline, texture_budgeting, overdraw_control, runtime_readability, godot_2d_handoff]
  - id: sprite-forge-specialist
    tier: specialist
    owns: [sprites, fx, props, maps, qc, godot_asset_handoff]
    skills: [generate2dsprite, generate2dmap, simple_readable_prompting, prompt_discipline, sheet_consistency, chroma_key_qc, frame_metadata, layered_map_handoff, approved_art_direction_execution, sprite_sheet_qc]
  - id: qa-lead
    tier: lead
    owns: [smoke_checks, playtest_plans, bug_triage, regression_risk, milestone_readiness]
    skills: [test_plans, acceptance_checks, playtest_reports, release_readiness]
  - id: reverse-engineering-specialist
    tier: specialist
    owns: [authorized_binary_analysis, strings, xrefs, decompile, save_resource_formats]
    skills: [ghidra_mcp, evidence_notes, compatibility_research, original_development_actions]

workflow_lanes:
  - id: git-startup
    route: [producer, technical-director]
    outputs: [git_repo, gitignore, readme, initial_commit, origin_status]
  - id: concept
    route: [producer, creative-director, game-designer]
    outputs: [promise, target_player, player_feedback_sources, feedback_synthesis, design_hypotheses, pillars, anti_pillars, reference_principles, design_visual_artifact_plan]
  - id: prototype
    route: [producer, prototyper, qa-lead]
    outputs: [risky_assumption, minimum_test, emoji_demo_placeholders, svg_placeholder_assets, verdict]
  - id: system-design
    route: [game-designer, systems-designer, qa-lead]
    outputs: [core_loop, systems, formulas, player_feedback_synthesis, direction_decision, acceptance_criteria, professional_flowchart_source, figma_uiue_source, exported_diagram_review_copies]
  - id: csv-data-config
    route: [systems-designer, data-config-specialist, technical-director, godot-specialist, qa-lead]
    outputs: [schemas, starter_rows, ids, validation_rules, loading_path]
  - id: technical-architecture
    route: [technical-director, lead-programmer, godot-specialist]
    outputs: [module_boundaries, module_contracts, scene_model, resource_model, signal_boundaries, default_2d_layer_model, performance_budget]
  - id: 2d-game-production
    route: [producer, creative-director, art-director, technical-director, 2d-technical-artist, relevant_specialist, godot-specialist, qa-lead]
    outputs: [camera_view, target_resolution, sprite_specs, animation_specs, layer_order, y_sort_rules, collision_layers, atlas_plan, import_settings, vfx_material_rules, qa_previews]
  - id: professional-art-production
    route: [creative-director, art-director, visual-development-artist, concept-artist, environment-artist, ui-artist, qa-lead]
    outputs: [art_brief, master_reference_decomposition, reference_board, anti_copying_notes, art_bible, mood_board, color_script, concept_sheets, environment_sheets, ui_style_frames, readability_pass, qc_verdict]
  - id: master-visual-design-review
    route: [creative-director, art-director, relevant_master_art_specialist, qa-lead]
    outputs: [master_learning_objects, knowledge_reserve, design_philosophy, originality_gate, visual_quality_rubric, revision_notes]
  - id: simple-premium-2d-visual-design
    route: [creative-director, art-director, relevant_master_art_specialist, 2d-technical-artist, qa-lead]
    outputs: [visual_sentence, complexity_budget, famous_company_reference_decomposition, readability_target, reusable_asset_plan, anti_copying_notes, revision_notes]
  - id: brawler-arcade-ui
    route: [art-director, ui-artist, ui-programmer, godot-specialist, qa-lead]
    outputs: [figma_uiue_source, exported_uiue_review_copy, screen_spec, design_tokens, component_state_matrix, reusable_controls, theme_notes, screenshot_parity_report, qa_checklist]
  - id: ui-implementation
    route: [art-director, ui-artist, ui-programmer, godot-specialist, qa-lead]
    outputs: [figma_or_screenshot_source, design_token_map, component_state_matrix, engine_ui_plan, reusable_controls, theme_resources, responsive_safe_area_notes, motion_feedback_notes, screenshot_parity_report, ui_qa_checklist]
  - id: sprite-forge-assets
    route: [art-director, relevant_art_specialist, sprite-forge-specialist, 2d-technical-artist, godot-specialist, qa-lead]
    outputs: [approved_art_direction, asset_spec, prompt, qc_report, sprite_specs, atlas_import_notes, godot_handoff]
  - id: implementation
    route: [lead-programmer, relevant_specialist, qa-lead]
    outputs: [module_breakdown, module_contracts, code_changes, data_changes, per_module_verification, integration_verification]
  - id: qa-tuning
    route: [qa-lead, systems-designer, performance-analyst]
    outputs: [smoke_check, playtest_notes, bug_list, balance_notes]
  - id: reverse-engineering
    route: [technical-director, lead-programmer, reverse-engineering-specialist, qa-lead]
    outputs: [authorization_basis, evidence, behavior_summary, original_action]
  - id: version-finish
    route: [producer, lead-programmer, qa-lead]
    outputs: [verification_summary, commit_hash, pushed_branch_or_blocker]

gates:
  - id: creative
    verdicts: [approve, concerns, reject]
  - id: player-feedback
    verdicts: [approve, concerns, reject]
  - id: technical
    verdicts: [approve, concerns, reject]
  - id: demo-placeholder
    verdicts: [approve, concerns, reject]
  - id: production
    verdicts: [approve, concerns, reject]
  - id: qa
    verdicts: [approve, concerns, reject]
  - id: performance
    verdicts: [approve, concerns, reject]
  - id: art
    verdicts: [approve, concerns, reject]
  - id: professional-art-quality
    verdicts: [approve, concerns, reject]
  - id: master-visual-design-quality
    verdicts: [approve, concerns, reject]
  - id: simple-premium-2d-quality
    verdicts: [approve, concerns, reject]
  - id: 2d-production-quality
    verdicts: [approve, concerns, reject]
  - id: design-document-artifacts
    verdicts: [approve, concerns, reject]
  - id: ui-implementation-quality
    verdicts: [approve, concerns, reject]
  - id: modular-implementation
    verdicts: [approve, concerns, reject]
